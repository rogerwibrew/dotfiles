[General]
# Tokyo Night SDDM Theme
# Based on where-is-my-sddm-theme with Tokyo Night color palette

# Password mask character
passwordCharacter=*
# Mask password characters or not ("true" or "false")
passwordMask=true
# value "1" is all display width, "0.5" is a half of display width etc.
passwordInputWidth=0.5
# Background color of password input (Tokyo Night background)
passwordInputBackground=#1a1b26
# Radius of password input corners
passwordInputRadius=10
# Width of the border for the password input
passwordInputBorderWidth=2
# Border color for the password input (Tokyo Night blue)
passwordInputBorderColor=#7aa2f7
# "true" for visible cursor, "false"
passwordInputCursorVisible=true
# Font size of password (in points)
passwordFontSize=32
# Cursor color (Tokyo Night cyan)
passwordCursorColor=#7dcfff
# Password text color (Tokyo Night foreground)
passwordTextColor=#c0caf5
# Allow blank password (e.g., if authentication is done by another PAM module)
passwordAllowEmpty=false

# Radius of the border which is displayed upon wrong authentication attempt
wrongPasswordBorderRadius=0
# Color of the border which is displayed upon wrong authentication attempt (Tokyo Night red)
wrongPasswordBorderColor=#f7768e

# Enable or disable cursor blink animation ("true" or "false")
cursorBlinkAnimation=true

# Show or not sessions choose label
showSessionsByDefault=false
# Font size of sessions choose label (in points).
sessionsFontSize=24

# Show or not users choose label
showUsersByDefault=true
# Font size of users choose label (in points)
usersFontSize=24
# Show user real name on label by default
showUserRealNameByDefault=true

# Path to background image
background=
# Or use just one color (Tokyo Night background)
backgroundFill=#1a1b26
# Fill mode for image background
# Value must be on of: aspect, fill, tile, pad
backgroundFillMode=aspect

# Default text color for all labels (Tokyo Night foreground)
basicTextColor=#c0caf5

# Blur radius for background image
blurRadius=0

# Hide cursor
hideCursor=false

# Default font (JetBrains Mono Nerd Font for consistency)
font=JetBrains Mono Nerd Font

# Font of help message
helpFont=JetBrains Mono Nerd Font
# Font size of help message (in points)
helpFontSize=18
