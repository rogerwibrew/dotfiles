# Hyprpaper Configuration
# Wallpaper daemon for Hyprland

# Preload wallpaper (change this to your preferred wallpaper)
preload = ~/.local/share/wallpapers/wallpaper.jpg

# Set wallpaper for all monitors
wallpaper = ,~/.local/share/wallpapers/wallpaper.jpg

# Enable IPC for dynamic wallpaper changes
ipc = on
