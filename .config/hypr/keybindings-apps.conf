# Application Keybindings
# TUI and WebApp shortcuts inspired by Omarchy

# TUI Applications (Terminal User Interface)
# These launch in dedicated kitty windows

# Lazygit - Git operations TUI
bind = SUPER SHIFT, G, exec, $HOME/dotfiles/scripts/tui/launch-tui.sh lazygit # Git operations

# Lazydocker - Docker management TUI
bind = SUPER SHIFT, D, exec, $HOME/dotfiles/scripts/tui/launch-tui.sh lazydocker # Docker management

# Btop - System resource monitor
bind = SUPER SHIFT, B, exec, $HOME/dotfiles/scripts/tui/launch-tui.sh btop # System monitor

# Impala - WiFi manager
bind = SUPER SHIFT, W, exec, $HOME/dotfiles/scripts/tui/launch-tui.sh impala # WiFi manager

# Yazi - File manager
bind = SUPER SHIFT, F, exec, $HOME/dotfiles/scripts/tui/launch-tui.sh yazi # File manager

# Pulsemixer - Audio device manager
bind = SUPER SHIFT, A, exec, $HOME/dotfiles/scripts/tui/launch-tui.sh pulsemixer # Audio mixer

# GUI Applications
# Chromium browser
bind = SUPER, B, exec, chromium # Launch browser

# Web Applications (Chromium standalone windows)
# These launch as frameless browser windows
# To add more webapps: ~/dotfiles/scripts/webapp/install-webapp.sh

# YouTube - Example webapp
# bind = SUPER SHIFT, Y, exec, chromium --app=https://youtube.com --class=webapp-youtube

# Add your own webapps below:
# bind = SUPER SHIFT, <KEY>, exec, chromium --app=<URL> --class=webapp-<name>
