# Hyprland Configuration - Laptop (watt)
# Tokyo Night Theme

# Monitor configuration
# eDP-1: 4K laptop display with 2.5x scaling for comfortable readability
monitor=eDP-1,3840x2160@60,0x0,2.5

# Execute at launch
exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = swayidle -w -C $HOME/.config/swayidle/config
exec-once = blueman-applet

# Environment variables
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct

# Miscellaneous settings
misc {
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
    disable_splash_rendering = true
    disable_hyprland_logo = true
}

# Input configuration
input {
    kb_layout = gb
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = 0
}

# General window configuration
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Tokyo Night colors
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(414868aa)

    layout = master
    allow_tearing = false
}

# Decoration
decoration {
    rounding = 8

    blur {
        enabled = true
        size = 3
        passes = 1
    }

    # Note: Shadow configuration disabled for compatibility with Hyprland 0.52
    # drop_shadow = true
    # shadow_range = 4
    # shadow_render_power = 3
    # col.shadow = rgba(1a1b26ee)
}

# Animations
animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# Layouts
master {
    new_status = master
    new_on_top = false
    mfact = 0.55
}

# Window rules
windowrulev2 = suppressevent maximize, class:.*

# Game window rules - auto fullscreen and floating
windowrulev2 = fullscreen, class:^(steam_app_.*)$  # Steam games auto fullscreen
windowrulev2 = float, class:^(steam_app_.*)$        # Games float (don't tile)
windowrulev2 = workspace 5, class:^(steam_app_.*)$  # Games open on workspace 5

# Keybindings
$mainMod = SUPER

# Application shortcuts
bind = $mainMod SHIFT, Return, exec, kitty # Launch terminal
bind = $mainMod, W, killactive, # Close active window
bind = $mainMod SHIFT, E, exit, # Exit Hyprland
bind = $mainMod, V, togglefloating, # Toggle floating mode
bind = $mainMod, D, exec, wofi --show drun # Application launcher
bind = $mainMod, F, fullscreen, # Toggle fullscreen

# Master layout specific
bind = $mainMod, Return, layoutmsg, swapwithmaster # Swap with master window
bind = $mainMod, J, layoutmsg, cyclenext # Focus next window
bind = $mainMod, K, layoutmsg, cycleprev # Focus previous window
bind = $mainMod, I, layoutmsg, addmaster # Increase master count
bind = $mainMod, O, layoutmsg, removemaster # Decrease master count

# Workspace navigation
bind = $mainMod, h, workspace, e-1 # Previous workspace
bind = $mainMod, l, workspace, e+1 # Next workspace

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1 # Switch to workspace 1
bind = $mainMod, 2, workspace, 2 # Switch to workspace 2
bind = $mainMod, 3, workspace, 3 # Switch to workspace 3
bind = $mainMod, 4, workspace, 4 # Switch to workspace 4
bind = $mainMod, 5, workspace, 5 # Switch to workspace 5
bind = $mainMod, 6, workspace, 6 # Switch to workspace 6
bind = $mainMod, 7, workspace, 7 # Switch to workspace 7
bind = $mainMod, 8, workspace, 8 # Switch to workspace 8
bind = $mainMod, 9, workspace, 9 # Switch to workspace 9
bind = $mainMod, 0, workspace, 10 # Switch to workspace 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1 # Move window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 # Move window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 # Move window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 # Move window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 # Move window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6 # Move window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7 # Move window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8 # Move window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9 # Move window to workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10 # Move window to workspace 10

# Screenshot shortcuts
bind = , Print, exec, $HOME/dotfiles/scripts/screenshot/screenshot.sh selection-clipboard # Screenshot selection to clipboard
bind = SHIFT, Print, exec, $HOME/dotfiles/scripts/screenshot/screenshot.sh full-clipboard # Screenshot full screen to clipboard
bind = $mainMod, Print, exec, $HOME/dotfiles/scripts/screenshot/screenshot.sh selection # Screenshot selection to file

# Volume control
binde = , XF86AudioRaiseVolume, exec, $HOME/dotfiles/scripts/volume-notify.sh up # Increase volume
binde = , XF86AudioLowerVolume, exec, $HOME/dotfiles/scripts/volume-notify.sh down # Decrease volume
bind = , XF86AudioMute, exec, $HOME/dotfiles/scripts/volume-notify.sh mute # Toggle mute

# Brightness control
binde = , XF86MonBrightnessUp, exec, $HOME/dotfiles/scripts/brightness-notify.sh up # Increase brightness
binde = , XF86MonBrightnessDown, exec, $HOME/dotfiles/scripts/brightness-notify.sh down # Decrease brightness

# Lock screen
bind = $mainMod, L, exec, swaylock -f # Lock screen

# Power menu
bind = $mainMod, P, exec, $HOME/dotfiles/scripts/power/powermenu.sh # Power menu

# Keybind reference
bind = $mainMod SHIFT, slash, exec, $HOME/dotfiles/scripts/keybind-reference.sh # Show keybind reference

# Source TUI and WebApp keybindings
source = ~/.config/hypr/keybindings-apps.conf
