# Sway Configuration - Laptop (watt)
# Host-specific settings for laptop machine

# =============================================================================
# OUTPUT CONFIGURATION
# =============================================================================

# 4K laptop display with 2.5x scaling for comfortable readability
# Note: Adjust output name based on actual hardware
# Check with: swaymsg -t get_outputs
output eDP-1 {
    resolution 3840x2160@60Hz
    position 0,0
    scale 2.5
}

# Environment variables
set $XCURSOR_SIZE 24

# =============================================================================
# INPUT CONFIGURATION
# =============================================================================

# GB keyboard layout for laptop
input "type:keyboard" {
    xkb_layout gb
}

# Laptop-specific touchpad settings
input "type:touchpad" {
    tap enabled
    natural_scroll disabled
    dwt enabled
    accel_profile adaptive
    pointer_accel 0.3
    scroll_factor 1.0
}

# =============================================================================
# POWER MANAGEMENT (laptop-specific)
# =============================================================================

# Close lid behavior - suspend on lid close
bindswitch --reload --locked lid:on exec systemctl suspend

# =============================================================================
# WORKSPACE ASSIGNMENT (optional)
# =============================================================================

# Assign specific applications to workspaces if desired
# assign [class="Firefox"] workspace 2
# assign [class="Chromium"] workspace 2
