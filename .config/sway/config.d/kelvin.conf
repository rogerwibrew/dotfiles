# Sway Configuration - Desktop (kelvin)
# Host-specific settings for desktop machine

# =============================================================================
# OUTPUT CONFIGURATION
# =============================================================================

# Desktop monitor with 1.666667x scaling
# Note: Adjust output name based on actual hardware
# Check with: swaymsg -t get_outputs
output * scale 1.666667

# Environment variables
set $XCURSOR_SIZE 24
set $GDK_SCALE 1.75

# =============================================================================
# INPUT CONFIGURATION
# =============================================================================

# US keyboard layout for desktop
input "type:keyboard" {
    xkb_layout us
}

# =============================================================================
# WORKSPACE ASSIGNMENT (optional)
# =============================================================================

# Assign specific applications to workspaces if desired
# assign [class="Firefox"] workspace 2
# assign [class="Chromium"] workspace 2
