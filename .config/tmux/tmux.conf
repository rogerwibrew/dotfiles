# Tmux Configuration
# Tokyo Night Theme

# Set prefix to Ctrl-a (more comfortable than Ctrl-b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable 256 colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Increase scrollback buffer size
set -g history-limit 10000

# Display time for pane indicators
set -g display-panes-time 2000

# Vi mode
setw -g mode-keys vi

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Tokyo Night Color Scheme
set -g status-style 'bg=#1a1b26 fg=#c0caf5'
set -g pane-border-style 'fg=#414868'
set -g pane-active-border-style 'fg=#7aa2f7'
set -g window-status-current-style 'bg=#7aa2f7 fg=#1a1b26 bold'
set -g window-status-style 'bg=#24283b fg=#c0caf5'

# Status bar configuration
set -g status-left-length 40
set -g status-right-length 80
set -g status-left '#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26] '
set -g status-right '#[bg=#24283b,fg=#c0caf5] %Y-%m-%d %H:%M '
set -g status-interval 60

# Message style
set -g message-style 'bg=#7aa2f7 fg=#1a1b26 bold'
